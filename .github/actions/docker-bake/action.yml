name: Docker Bake
description: Build [and push] Docker images using docker/bake-action

inputs:
  target:
    description: Bake target name
    required: true
  build-mode:
    description: Build mode (develop, master, release, pre-release)
    required: true
    default: develop
  git-hash:
    description: Short git hash
    required: true
  version:
    description: Full version string (from version_manager compose)
    required: false
    default: ''
  push:
    description: Whether to push images to registry
    required: false
    default: 'true'
  cache-scope:
    description: Cache scope suffix (defaults to the target name)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - id: setup
      uses: ./.github/actions/docker-setup
      with:
        ghcr-token: ${{ github.token }}
        login: ${{ inputs.push }}

    - id: cache-epoch
      shell: bash
      run: echo "CACHE_EPOCH=$(cat docker/cache-epoch)" >> "$GITHUB_OUTPUT"

    - name: Build (no push) ${{ inputs.target }}
      if: ${{ inputs.push != 'true' }}
      uses: docker/bake-action@v7
      with:
        source: .
        files: docker/docker-bake.hcl
        targets: ${{ inputs.target }}
        push: false
        provenance: false
        builder: ${{ steps.setup.outputs.builder-name }}
        set: |
          *.cache-from=type=gha,scope=clover2-${{ inputs.cache-scope || inputs.target }}-e${{ steps.cache-epoch.outputs.CACHE_EPOCH }}
        vars: |
          REGISTRY=ghcr.io/${{ github.repository_owner }}/clover2/
          BUILD_MODE=${{ inputs.build-mode }}
          CLOVER2_GIT_HASH=${{ inputs.git-hash }}
          CLOVER2_VERSION=${{ inputs.version }}

    - name: Build and push ${{ inputs.target }}
      if: ${{ inputs.push == 'true' }}
      uses: docker/bake-action@v7
      with:
        source: .
        files: docker/docker-bake.hcl
        targets: ${{ inputs.target }}
        push: true
        builder: ${{ steps.setup.outputs.builder-name }}
        set: |
          *.cache-from=type=gha,scope=clover2-${{ inputs.cache-scope || inputs.target }}-e${{ steps.cache-epoch.outputs.CACHE_EPOCH }}
          *.cache-to=type=gha,scope=clover2-${{ inputs.cache-scope || inputs.target }}-e${{ steps.cache-epoch.outputs.CACHE_EPOCH }},mode=max
        vars: |
          REGISTRY=ghcr.io/${{ github.repository_owner }}/clover2/
          BUILD_MODE=${{ inputs.build-mode }}
          CLOVER2_GIT_HASH=${{ inputs.git-hash }}
          CLOVER2_VERSION=${{ inputs.version }}
