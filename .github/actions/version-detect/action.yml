name: Detect Version
description: Determine the build type and populate the variables

outputs:
  build_mode:
    description: develop, master, release or pre-release build mode
    value: ${{ steps.compose.outputs.build_mode }}
  git_hash:
    description: Short git hash
    value: ${{ steps.compose.outputs.git_hash }}
  version:
    description: Full version for the current ref
    value: ${{ steps.compose.outputs.version }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install dependencies
      shell: bash
      run: pip install semver lxml gitpython

    - id: compose
      env:
        GITHUB_REF: ${{ github.ref }}
      shell: bash
      run: |
        COMPOSE=$(python3 tooling/scripts/version_manager -d . compose --ref "$GITHUB_REF" --json)
        echo "compose: ${COMPOSE}"
        echo "build_mode=$(echo "${COMPOSE}" | jq -r .build_mode)" >> "$GITHUB_OUTPUT"
        echo "git_hash=$(echo "${COMPOSE}" | jq -r .git_hash)" >> "$GITHUB_OUTPUT"
        echo "version=$(echo "${COMPOSE}" | jq -r .version)" >> "$GITHUB_OUTPUT"
