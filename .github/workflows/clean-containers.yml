name: Cleanup Container Registry
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  clean-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Purge old container versions
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: klever-coex
          token: ${{ secrets.GHCR_PAT }}
          image-names: "clover2/*"
          cut-off: "3d"
          keep-n-most-recent: 3
          image-tags: "!latest !stable"
          dry-run: false
          tag-selection: both
