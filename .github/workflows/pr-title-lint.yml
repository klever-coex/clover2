name: Lint PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  pull-requests: read
  statuses: write

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feature
            feat
            fix
            bug
            docs
            documentation
            refactor
            style
            ci
            test
            chore
            release
          ignoreLabels: |
            dependencies
