name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '"pre-release" cuts/advances an rc series; "stable" releases a bumped version'
        required: true
        type: choice
        options: [stable, pre-release]
        default: stable
      bump:
        description: 'Version bump (base bump for a fresh rc cut)'
        required: true
        type: choice
        options: [major, minor, patch]
        default: patch
      promote_rc:
        description: 'Stable release of the latest rc series base from the current HEAD (no bump)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (no push, no tag)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release

jobs:
  prepare-release:
    if: startsWith(github.ref, 'refs/heads/support/') || github.ref == 'refs/heads/master' || inputs.dry_run
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - uses: klever-coex/clover2-cli@v0.0.6

      - name: Prepare version
        id: prepare
        env:
          CHANNEL: ${{ inputs.channel }}
          BUMP: ${{ inputs.bump }}
          PROMOTE_RC: ${{ inputs.promote_rc }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          VM="clover2 version --root ."

          if [[ "$CHANNEL" == "pre-release" ]]; then
            BUMP_JSON=$($VM bump rc --base "$BUMP" --json)
          elif [[ "$PROMOTE_RC" == "true" ]]; then
            RC_TAG=$($VM compose --latest-rc --field tag)
            VERSION=$($VM compose --latest-rc --field version)
            BUMP_JSON=$(jq -n --arg v "$VERSION" '{tag: ("v" + $v), stores_changed: false}')

            echo "Promoting ${RC_TAG}; commits included after it:"
            git log --oneline "${RC_TAG}..HEAD" || true
          else
            CURRENT=$($VM compose --mode develop --field base_version)
            if [[ "$GITHUB_REF" == "refs/heads/master" ]] && [[ -n "$(git tag --list "v${CURRENT}-rc.*")" ]]; then
              echo "RC series for v${CURRENT} already exists;" >&2
              echo "run with promote_rc=true, or cut a new rc (channel=pre-release)" >&2
              exit 1
            fi
            BUMP_JSON=$($VM bump "$BUMP" --json)
          fi
          echo "prepare: ${BUMP_JSON}"

          echo "tag=$(echo "${BUMP_JSON}" | jq -r .tag)" >> "$GITHUB_OUTPUT"
          echo "changed=$(echo "${BUMP_JSON}" | jq -r .stores_changed)" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$($VM compose --latest-stable --field tag)" >> "$GITHUB_OUTPUT"
          echo "to_tag=HEAD" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: .github/changelog-config.json
          fromTag: ${{ steps.prepare.outputs.previous_tag }}
          toTag: ${{ steps.prepare.outputs.to_tag }}

      - name: Commit, tag and push
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
          CHANGED: ${{ steps.prepare.outputs.changed }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "Tag ${TAG} already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ "$CHANGED" == "true" ]]; then
            git add -A
            git commit -m "release: ${TAG}"
          fi

          git tag -a "${TAG}" -m "Release ${TAG}"

          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "refs/tags/${TAG}"

      - name: Create support branch
        if: ${{ !inputs.dry_run && inputs.channel == 'stable' }}
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          BRANCH="support/$(echo "${VERSION}" | cut -d. -f1-2)"

          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" > /dev/null; then
            echo "Branch ${BRANCH} already exists, skipping"
          else
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: Release ${{ steps.prepare.outputs.tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ inputs.channel == 'pre-release' }}

      - name: Telegram notify - failure
        if: ${{ !inputs.dry_run && failure() }}
        uses: klever-coex/ci/.github/actions/release-notify@master
        with:
          telegram_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat: ${{ secrets.TELEGRAM_TO }}
          status: failure
          project: clover2
          tag: ${{ steps.prepare.outputs.tag }}
