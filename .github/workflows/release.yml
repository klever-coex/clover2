name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options: [major, minor, patch]
        default: patch
      dry_run:
        description: 'Dry run (no push, no tag)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  prepare-release:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r ./tooling/requirements.txt

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          CURRENT=$(python3 tooling/scripts/version_manager.py -d . print --main-only)
          echo "Current version: $CURRENT"
          python3 tooling/scripts/version_manager.py -vvv -d . bump "$BUMP"
          NEW_VERSION=$(python3 tooling/scripts/version_manager.py -d . print --main-only)
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          PREVIOUS_TAG=$(git tag --sort=-creatordate | head -1)
          echo "previous_tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: .github/changelog-config.json
          fromTag: ${{ steps.bump.outputs.previous_tag }}
          toTag: HEAD

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: ${TAG}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin HEAD:master --follow-tags

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: Release ${{ steps.bump.outputs.tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
