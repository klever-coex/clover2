# Module mounting relative to base_link: xyz in metres, rpy in radians.
# Mounts are preliminary, not calibrated extrinsics. Hardware constants live in xacro.
modules:
  main_camera:
    xyz: "0.055 0 0"
    rpy: "-1.57 1.57 -1.57"
  front_camera:
    xyz: "0.085 0 -0.0085"
    rpy: "0 0 0"
  lidar:
    xyz: "0 0 0.12"
    rpy: "0 0 0"
  led_strip:
    xyz: "0 0 0.025"
    rpy: "0 0 0"
