main_camera:
  type: object
  description: "Down facing camera settings"
  fields:
    enable:
      type: bool
      default: true
      description: "Enable main camera"
    feature_detector:
      type: bool
      default: true
      description: "Enable Feature detector(Aruco) on this camera"

front_camera:
  type: object
  description: "Front facing camera settings"
  fields:
    enable:
      type: bool
      default: false
      description: "Enable front camera"

optical_flow:
  type: object
  description: "Optical flow"
  fields:
    enable:
      type: bool
      default: true
      description: "Enable optical flow"

fcu_bridge:
  type: object
  description: "Flight controller unit bridge"
  fields:
    fcu_conn:
      type: str
      default: "uart"
      description: "FCU connection type"
      enum: ["usb", "uart", "tcp", "udp"]

localization:
  type: object
  description: "Drone localization subsystem"
  fields:
    map_server:
      type: object
      description: "ArUco marker map server"
      fields:
        enable:
          type: bool
          default: true
          description: "Enable map server"
        map_filename:
          type: str
          default: "example-1.yaml"
          description: "Map file name"
    aruco_tracker:
      type: object
      description: "ArUco marker tracker"
      fields:
        enable:
          type: bool
          default: true
          description: "Enable ArUco tracker"

indication:
  type: object
  description: "Indication settings"
  fields:
    led_strip:
      type: bool
      default: true
      description: "Enable LED Strip driver"

notification:
  type: object
  description: "Notification settings"
  fields:
    led_strip:
      type: bool
      default: true
      description: "Enable LED Strip notification output"
    start_delay:
      type: double
      default: 5.0
      description: "Delay before starting notification node, seconds"

display:
  type: object
  description: "Display settings"
  fields:
    display:
      type: bool
      default: true
      description: "Enable display driver"

2d_lidar:
  type: object
  description: "RPLidar Driver Settings"
  fields:
    enable:
      type: bool
      default: false
      description: "Enable RPLidar Driver"
