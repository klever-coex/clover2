/**:
  ros__parameters:
    use_intra_process_comms: true

/**/aruco_tracker:
  ros__parameters:
    tracking: "base_link"

/**/fcu_bridge:
  ros__parameters:
    speed_limit: 1.0
    tolerance: 0.15
    slowdown_distance: 0.5
    diagnostics:
      battery:
        warn_percentage: 0.20
        error_percentage: 0.10
      sensors:
        stale_timeout_sec: 1.0

/**/web_video_server:
  ros__parameters:
    port: 8081

/**/led_strip:
  ros__parameters:
    device_plugin: "ws2812_spi"
    brightness_scale: 0.5
    led_count: 80
    ws2812_spi:
      spi_device: "/dev/spidev0.0"
