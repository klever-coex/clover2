/**:
  ros__parameters:
    use_intra_process_comms: true

/**/aruco_tracker:
  ros__parameters:
    tracking: "base_link"
    tf:
      send: true
      child_frame_id: "vision_estimate"
    solver: "global_pnp"
    global_pnp:
      ransac_iterations: 100
      ransac_reproj_px: 2.5
      min_markers: 1
    average:
      min_markers: 1

/**/fcu_bridge:
  ros__parameters:
    speed_limit: 1.0
    tolerance: 0.35
    slowdown_distance: 0.5
    diagnostics:
      battery:
        warn_percentage: 0.20
        error_percentage: 0.10
      sensors:
        stale_timeout_sec: 1.0

/**/led_strip:
  ros__parameters:
    device_plugin: "ws2812_spi"
    brightness_scale: 0.5
    led_count: 80
    ws2812_spi:
      spi_device: "/dev/spidev0.0"

/**/display:
  ros__parameters:
    device_plugin: "ssd1306_i2c"
    ssd1306_i2c:
      i2c_device: "/dev/i2c-1"
      resolution: "128x64"
      i2c_addres: 0x3C
