# Klever5 platform configuration
# Pass to run_platform.py:  run_platform.py params/klever5.platform.yaml

main_camera:
  enable: true
  feature_detector: false

front_camera:
  enable: true
  feature_detector: false

optical_flow:
  enable: false

fcu_bridge:
  interface: usb

localization:
  enable: true
  map_server:
    enable: true
    map_filename: example-1.yaml
  tracker:
    enable: true
