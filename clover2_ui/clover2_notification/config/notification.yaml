/**/notification:
  ros__parameters:
    providers_list:
      - diagnostics
      - system

    output_plugins:
      - led_strip
      - display

    providers:
      diagnostics:
        topic: /diagnostics_agg
        ignore_names:
          - "/Aggregation"
          - "/Aggregation/Other"
          - "/Aggregation/Other/*"
          - "/Aggregation/System"
          - "/Aggregation/System/*"
          - "/Aggregation/Vision"
          - "/Aggregation/Localization"
          - "/Aggregation/FCU"

      system:
        enabled: true
        period: 1.0

        cpu:
          enabled: true
          warn_usage: 85.0
          error_usage: 95.0

        temperature:
          enabled: true
          warn_celsius: 70.0
          error_celsius: 85.0
          thermal_zone: ""

        network:
          enabled: true
          interfaces:
            - wlan0
            - eth0

        proc_stat_path: /proc/stat
        thermal_base_path: /sys/class/thermal
        net_base_path: /sys/class/net

    led_strip:
      enabled: true
      plugin: led
      base_path: led_strip

      reaction_names:
        - power
        - fcu_backend

      reactions:
        power:
          event_name: "Power"
          animation: blink
          color: [255, 128, 0]
          brightness: 0.8
          period: 0.8
          duration: 3.0

        fcu_backend:
          event_name: "FCU backend"
          animation: blink
          color: [255, 0, 0]
          brightness: 1.0
          period: 0.15
          duration: 3.0

    display:
      enabled: true
      plugin: display
      base_path: display
      refresh_period: 1.0
      layout: compact

      status_names:
        - hostname
        - network
        - system

      statuses:
        hostname:
          type: hostname
          label: host

        network:
          source: system
          event_name: network
          label: ""

        system:
          type: group
          items:
            - cpu
            - temperature
          separator: " "

        cpu:
          source: system
          event_name: cpu
          label: cpu

        temperature:
          source: system
          event_name: temperature
          label: temp

      alert:
        enabled: true
        invert_period: 0.5
